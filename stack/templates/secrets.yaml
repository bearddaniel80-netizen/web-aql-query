apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-app-secrets
type: Opaque
stringData:
  fastapi_internal_key: {{ required "secrets.fastapiInternalKey is required" .Values.secrets.fastapiInternalKey | quote }}
  minio_app_user: {{ required "secrets.minioAppUser is required" .Values.secrets.minioAppUser | quote }}
  minio_app_password: {{ required "secrets.minioAppPassword is required" .Values.secrets.minioAppPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-minio-root
type: Opaque
stringData:
  minio_root_user: {{ required "secrets.minioRootUser is required" .Values.secrets.minioRootUser | quote }}
  minio_root_password: {{ required "secrets.minioRootPassword is required" .Values.secrets.minioRootPassword | quote }}
