{{- range $name, $app := .Values.apps }}
{{- if $app.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/part-of: {{ $.Chart.Name }}
spec:
  replicas: {{ $app.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/part-of: {{ $.Chart.Name }}
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ $name }}
                    app.kubernetes.io/instance: {{ $.Release.Name }}
      containers:
        - name: {{ $name }}
          image: "{{ $app.image.repository }}:{{ $app.image.tag }}"
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          ports:
            {{- range $app.ports }}
            - name: {{ .name }}
              containerPort: {{ .port }}
              protocol: {{ .protocol | default "TCP" }}
            {{- end }}
          {{- with $app.env }}
          env:
            {{- range $k, $v := . }}
            - name: {{ $k }}
              value: {{ tpl (toString $v) $ | quote }}
            {{- end }}
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: {{ (index $app.ports 0).name }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ (index $app.ports 0).name }}
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- with $app.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or $app.secrets $app.emptyDirs }}
          volumeMounts:
            {{- if $app.secrets }}
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            {{- end }}
            {{- range $app.emptyDirs }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
          {{- end }}
      {{- if or $app.secrets $app.emptyDirs }}
      volumes:
        {{- if $app.secrets }}
        - name: secrets
          secret:
            secretName: {{ $.Release.Name }}-app-secrets
            defaultMode: 0440
        {{- end }}
        {{- range $app.emptyDirs }}
        - name: {{ .name }}
          emptyDir: {}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  type: {{ $app.service.type | default "ClusterIP" }}
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
  ports:
    {{- range $app.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .name }}
      protocol: {{ .protocol | default "TCP" }}
    {{- end }}
{{- end }}
{{- end }}
